<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wa-Tor Simulator</title>
    <style>
      body {
        background-color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      canvas {
        border: 1px solid #333;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #stats {
        color: #00ff00;
        font-family: monospace;
        font-size: 16px;
        display: flex;
        gap: 24px;
      }
      #controls {
        display: flex;
        gap: 12px;
      }
      button {
        background-color: #333;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 6px 18px;
        font-family: monospace;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background-color: #00ff00;
        color: #000;
      }    </style>
  </head>
  <body>
<body>
    <div id="app">
      <canvas id="world"></canvas>
      <div id="stats">
        <span>Step: <span id="stat-step">0</span></span>
        <span>魚: <span id="stat-fish">0</span></span>
        <span>サメ: <span id="stat-shark">0</span></span>
      </div>
      <div id="controls">
        <button id="btn-start">Start</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-step">Step</button>
      </div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>  </body>
</html>
